name: Escludi record regionali dai tab C.U.

on:
  push:
    paths:
      - '.github/workflows/exclude-regional-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_exclude_regional.py
      - run: git diff -- index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Escludi record regionali dai tab C.U."
          git push

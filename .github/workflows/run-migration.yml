name: Migrazione dati statici

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python migrate_index.py
      - run: git status --short
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.js
          git commit -m "Separa dati statici e aggiorna filtri e KPI"
          git push

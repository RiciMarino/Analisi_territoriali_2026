name: Normalizza categorie una tantum

on:
  push:
    paths:
      - '.github/workflows/normalize-categories-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python normalize_categories.py
      - run: git diff -- data.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Normalizza diciture categorie"
          git push

name: Inverti tab una tantum

on:
  push:
    paths:
      - '.github/workflows/swap-tabs-once.yml'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python swap_tabs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inverte Attività regionali e Riepilogo attività"
          git push
